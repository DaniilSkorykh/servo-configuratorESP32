[tool.pytest.ini_options]
pythonpath = ["desktop_app"]
testpaths = ["tests"]
# Нагрузочные тесты идут минуты, поэтому в обычный прогон не входят:
#   pytest           быстрая проверка
#   pytest -m slow   нагрузочные
addopts = "-m 'not slow'"
markers = [
    "slow: нагрузочные и длительные проверки",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Набор задан явно, чтобы проверка не менялась вместе с версией ruff.
select = [
    "E",    # стиль (pycodestyle)
    "F",    # ошибки (pyflakes)
    "I",    # порядок импортов
    "UP",   # устаревшие конструкции
    "B",    # типичные ловушки (bugbear)
    "C4",   # генераторы и коллекции
    "SIM",  # упрощения
    "RUF",  # правила самого ruff
]
ignore = [
    "RUF001",  # кириллица в строках — здесь она уместна
    "RUF002",
    "RUF003",
    "E501",    # длину строк держим сами, но не ценой читаемости сообщений
]

[tool.ruff.lint.isort]
# Пакет приложения — свой, а не сторонний: иначе его импорты сливаются с pytest.
known-first-party = ["servo_configurator", "main"]

[tool.ruff.lint.per-file-ignores]
# В тестах обращение к внутренностям виджетов оправдано: проверяется состояние
# интерфейса, а публичных геттеров для него нет.
"tests/*" = ["SLF001", "B011"]

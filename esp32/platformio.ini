; Прошивка Waveshare Servo Driver with ESP32 (SKU 21593) для Feetech STS3215.
;
; Сборка:  pio run
; Прошивка: pio run -t upload
; Монитор:  pio device monitor -b 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Скорость обмена с ПК: download UART платы работает на 115200 (раздел 1 протокола).
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Wall
    -Wextra
    ; Версия прошивки попадает в ответ на ping и в событие boot.
    -D FIRMWARE_VERSION='"1.0.0"'
